name: SMAC price feed
on:
  schedule:
    - cron: "7 21 * * 1-5"    # 21:07 UTC = 01:07 Baku, right after the US close (GitHub may start it later)
    - cron: "41 21 * * 1-5"   # backup run, 01:41 Baku
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smac-prices
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yfinance
        run: pip install --quiet yfinance
      - name: Fetch prices
        run: python smac-data/fetch_prices.py
      - name: Commit
        run: |
          git config user.name "smac-bot"
          git config user.email "smac-bot@users.noreply.github.com"
          git add smac-data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "SMAC prices $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
